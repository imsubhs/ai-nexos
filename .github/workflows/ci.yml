name: CI

on:
  push:
    # `phase-2-production-readiness` is Phase 2's branch of record
    # (docs/SPRINT-2.4.md) and is the branch the deploy job below gates on.
    branches: [main, phase-2-production-readiness]
  pull_request:

# Two pushes in quick succession would otherwise race two promotions to the same
# production alias. Queue rather than cancel: cancelling a deploy mid-promotion
# can leave the alias pointing at a build that was never finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint · Format · Typecheck · Test · Build
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders — real values are Vercel/Supabase secrets.
      # NODE_ENV is deliberately left unset: `next build` must succeed without
      # runtime secrets (src/instrumentation.ts skips the boot gate during the
      # build phase), and this job proves it.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Sprint 2.2. Not folded into `npm test` because a vulnerable dependency
      # is an operational signal, not a broken build: it can appear on a commit
      # that changed nothing, and it is fixed by upgrading rather than by
      # editing code. The authorization audit runs inside the test suite
      # (tests/unit/authorization-coverage.test.ts), where a regression *is* a
      # code defect and should block exactly like any other failing test.
      - name: Dependency vulnerability audit
        run: npm run audit:deps

  # ───────────────────────────────────────────────────────────────────────────
  # Sprint 2.4 — production deploy (P-01…P-07).
  #
  # `needs: quality` is the whole of P-01: lint, format, typecheck, test, build
  # and audit:deps must pass before anything reaches production, and a pull
  # request runs `quality` alone, so it validates without deploying (P-03).
  #
  # WHY THERE IS NO `env:check` STEP IN THIS JOB.
  #
  # The five Supabase variables are Vercel **Sensitive** variables. A sensitive
  # value is write-only: `vercel pull` returns the key with a redacted
  # placeholder instead of the value. Measured, not assumed — every one came
  # back as an 11-character placeholder while `JWT_SECRET` (encrypted) came back
  # at its true length. A gate running here would therefore validate
  # placeholders and pass, which is strictly worse than having no gate at all,
  # because it would look green while nothing real had been checked. Presence
  # checks are exactly what a placeholder satisfies.
  #
  # So the gate runs INSIDE the Vercel build, where the real values exist. It is
  # the project's Build Command:
  #
  #     npm run env:check -- --production --verify && npm run build
  #
  # That is the same script this repository has always used. It asserts every
  # production-required variable, rejects http:// and loopback origins, opens a
  # real Postgres connection through the pooler and a real Storage request, and
  # prints names and states only. A non-zero exit fails the build, and a failed
  # build produces no deployment — so a misconfigured deployment cannot be
  # promoted, rather than merely being caught before it is.
  #
  # This is why the deploy below is NOT `--prebuilt`. Building locally and
  # uploading the output would bake the redacted placeholders into the client
  # bundle as the Supabase URL, and skip the gate entirely.
  #
  # Verified by execution, not by reading: injecting `DEMO_MODE=true` as a
  # build-only env produced `BUILD_ERROR`, readyState `ERROR`, and no promotion,
  # while production continued serving the previous deployment (M-14, P-07).
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Production deploy
    needs: quality
    # Push-only, production branch only, and explicitly switched on. The
    # repository variable is the switch: until PRODUCTION_DEPLOY_ENABLED is
    # "true" this job is skipped rather than failed, so the pipeline is not
    # permanently red while the Vercel secrets are still being provisioned. A
    # skipped job is visibly not a passed job, which is the point — see
    # docs/DEPLOYMENT.md §0 for what is actually wired.
    #
    # The branch literal is repeated rather than read from `env:` because the
    # `env` context is not available in a job-level `if`. When Phase 2 merges to
    # `main`, change it here and in Vercel's Production Branch together.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/phase-2-production-readiness' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Read by the Vercel CLI from the environment, deliberately never passed
      # as `--token=…`. A command-line argument is visible to anything that
      # echoes the command — npm's run notice does exactly that — and that is
      # how a token ends up in a build log.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Fail loudly rather than letting the CLI report something obscure.
      - name: Require deployment credentials
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::production deploy is enabled but these secrets are unset:$missing"
            exit 1
          fi
          echo "all three deployment credentials are present"

      # Pinned rather than @latest: a deploy pipeline should not change
      # behaviour because an upstream release happened overnight.
      - name: Install Vercel CLI
        run: npm install --global vercel@58.9.5

      # Only the two public origins are wanted here, for the post-deploy check.
      # They are `plain` variables, so they survive the pull intact. The pulled
      # file is NOT used as gate input — see the note above — and is removed
      # immediately because it also contains readable encrypted values.
      # Parsed with grep rather than dotenv so this job needs no npm install.
      - name: Resolve production origins
        id: origins
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production >/dev/null
          f=.vercel/.env.production.local
          app="$(grep -E '^NEXT_PUBLIC_APP_URL=' "$f" | head -1 | cut -d= -f2- | tr -d '"')"
          portal="$(grep -E '^NEXT_PUBLIC_PORTAL_URL=' "$f" | head -1 | cut -d= -f2- | tr -d '"')"
          rm -f "$f"
          [ -n "$app" ] || { echo "::error::NEXT_PUBLIC_APP_URL is not set in production"; exit 1; }
          [ -n "$portal" ] || { echo "::error::NEXT_PUBLIC_PORTAL_URL is not set in production"; exit 1; }
          # The proxy routes on the Host header alone, so one hostname for both
          # would make the portal branch swallow /login and /auth/callback.
          [ "$app" != "$portal" ] || { echo "::error::app and portal origins must differ"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "portal=$portal" >> "$GITHUB_OUTPUT"
          echo "app=$app portal=$portal"

      # Remote build. Vercel runs the Build Command, which runs the gate against
      # the real Sensitive values, then builds. Promotion happens only if both
      # succeed, so a failed gate leaves the previous deployment serving (P-07).
      #
      # NEXT_PUBLIC_BUILD_NUMBER is passed as a build env rather than stored as a
      # project variable because it changes every deploy and NEXT_PUBLIC_* is
      # substituted at build time (C-13).
      - name: Deploy to production
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prod --yes \
            --build-env NEXT_PUBLIC_BUILD_NUMBER="${GITHUB_SHA::12}")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployed $GITHUB_SHA -> $url"

      # P-06: the deployed commit is discoverable from the pipeline output.
      - name: Record deployed revision
        run: |
          {
            echo "### Production deploy"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- deployment: ${{ steps.deploy.outputs.url }}"
            echo "- app: ${{ steps.origins.outputs.app }}"
            echo "- portal: ${{ steps.origins.outputs.portal }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The boot gate runs at process start, which is after promotion. This is
      # the first evidence that the deployed process actually started and is
      # answering on both hosts (M-01, M-02, D-07).
      - name: Post-deploy health check
        run: |
          set -euo pipefail
          for origin in "${{ steps.origins.outputs.app }}" "${{ steps.origins.outputs.portal }}"; do
            echo "checking $origin/api/health"
            code=""
            for attempt in 1 2 3 4 5; do
              code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$origin/api/health" || true)"
              if [ "$code" = "200" ]; then break; fi
              echo "  attempt $attempt: HTTP $code"
              sleep 5
            done
            if [ "$code" != "200" ]; then
              echo "::error::$origin/api/health returned HTTP $code"
              cat /tmp/health.json || true
              exit 1
            fi
            grep -q '"status":"healthy"' /tmp/health.json \
              || { echo "::error::$origin/api/health is not healthy"; cat /tmp/health.json; exit 1; }
            grep -q '"environment":"production"' /tmp/health.json \
              || { echo "::error::$origin/api/health is not running as production"; cat /tmp/health.json; exit 1; }
          done
          echo "both origins healthy and reporting production"
